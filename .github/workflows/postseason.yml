name: Update postseason statistics

on:
  schedule:
    # UTC coverage for both PDT and PST; the gate enforces Pacific hours.
    - cron: '5,35 0-7,20-23 * * *'
    - cron: '30 6,7 * * *'
  workflow_dispatch:
    inputs:
      external_schedule:
        description: 'Scheduled external request (enforce Pacific hours)'
        type: boolean
        default: false
        required: false

concurrency:
  group: postseason-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      allowed: ${{ steps.timing.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record timing and check Pacific window
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          EXTERNAL_SCHEDULE: ${{ inputs.external_schedule }}
        run: python3 -m scripts.schedule_gate
      - uses: actions/setup-python@v7.0.0
        if: steps.timing.outputs.allowed == 'true'
        with:
          python-version: '3.14'
      - name: Install test dependencies
        if: steps.timing.outputs.allowed == 'true'
        run: python -m pip install pytest -r requirements-export.txt
      - name: Run offline tests
        if: steps.timing.outputs.allowed == 'true'
        run: python -m pytest -q
      - name: Check completed games and refresh if needed
        id: refresh
        if: steps.timing.outputs.allowed == 'true'
        env:
          AUDIT: ${{ steps.timing.outputs.audit }}
        shell: bash
        run: |
          if [ "$AUDIT" = "true" ]; then
            python -m scripts.auto_update --audit
          else
            python -m scripts.auto_update
          fi
      - name: Save generated statistics
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/league.json docs/data/player-stats.json
          git commit -m 'Update postseason statistics'
          git push
      - name: Package site
        if: steps.timing.outputs.allowed == 'true' && (steps.refresh.outputs.changed == 'true' || github.run_attempt > 1)
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs
  deploy:
    needs: update
    if: needs.update.outputs.allowed == 'true' && (needs.update.outputs.changed == 'true' || github.run_attempt > 1)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
