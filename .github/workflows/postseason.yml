name: Update postseason statistics

on:
  schedule:
    - cron: '0 13 * * *'
      timezone: America/Los_Angeles
    - cron: '30 13-23 * * *'
      timezone: America/Los_Angeles
    - cron: '0 14-23 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

concurrency:
  group: postseason-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest -r requirements-export.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check completed games and refresh if needed
        id: refresh
        env:
          AUDIT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * *' }}
        shell: bash
        run: |
          if [ "$AUDIT" = "true" ]; then
            python -m scripts.auto_update --audit
          else
            python -m scripts.auto_update
          fi
      - name: Save generated statistics
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/league.json docs/data/player-stats.json
          git commit -m 'Update postseason statistics'
          git push
      - name: Package site
        if: steps.refresh.outputs.changed == 'true' || github.run_attempt > 1
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.run_attempt > 1
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
